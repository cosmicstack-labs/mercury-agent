<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060a"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Ghost mercury glyph watermark (fills the right side) -->
  <text x="1230" y="600" font-family="Georgia, 'Times New Roman', serif" font-size="460" font-weight="700" fill="url(#logoGrad)" opacity="0.07" text-anchor="end">&#9791;</text>

  <!-- Logo mark + brand -->
  <g transform="translate(80, 80)">
    {{LOGO_SVG}}
    <text x="62" y="30" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Mercury Agent  ·  Docs</text>
  </g>

  <!-- Section breadcrumb (dynamically replaced, top-right) -->
  {{BREADCRUMB}}

  <!-- Page title (dynamically replaced) -->
  {{TITLE_SVG}}

  <!-- Page description (dynamically replaced) -->
  {{DESC_SVG}}

  <!-- "In this page" section headings (dynamically replaced) -->
  {{BULLETS}}

  <!-- Page URL (dynamically replaced) -->
  <text x="1120" y="588" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#4a4a58" text-anchor="end">{{PAGE_URL}}</text>
</svg>