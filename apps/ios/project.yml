# XcodeGen spec: `xcodegen generate` makes Mercury.xcodeproj (not committed).
name: Mercury
options:
  bundleIdPrefix: sh.mercuryagent
  deploymentTarget:
    iOS: "17.0"
packages:
  MercuryKit:
    path: MercuryKit
  # Mercury's shared Rust voice engine (scripts/build-voice-engine.sh builds its xcframework).
  MercuryVoice:
    path: MercuryVoice
targets:
  Mercury:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: MercuryKit
        product: MercuryUI
      - package: MercuryVoice
        product: MercuryVoice
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mercury
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Mercury uses the camera to scan the pairing code shown in Mercury Desktop.
        NSMicrophoneUsageDescription: Mercury uses the microphone for voice calls and dictation.
        # Calls are CallKit calls: audio keeps them going in the background, and CallKit
        # only takes calls from an app with the voip mode (no PushKit: Mercury never rings).
        UIBackgroundModes: [audio, voip]
        NSLocalNetworkUsageDescription: Mercury connects to the Mercury running on your computer.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.mercuryagent.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        # The Mercury mark, full-bleed (App/Assets.xcassets; iOS rounds the corners).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
