name: Android

# Mercury for Android (apps/android): the debug APK on every change, so the
# app can be installed and tried without a Mac. Nothing here publishes.
# The voice engine's JNI libraries are not built here (they need rustup +
# cargo-ndk + NDK, see apps/android/scripts/build-voice-engine.sh), so voice
# calls and dictation fail at runtime until those libraries are added; the
# chat UI builds and runs without them.

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: apps/android
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mercury-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
