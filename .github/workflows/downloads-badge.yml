name: Downloads badge

# Refreshes .github/badges/downloads.json (npm + installer binary downloads),
# read by the README's shields.io endpoint badge via raw.githubusercontent.com.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-badge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: Compute totals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/download-stats.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- .github/badges; then echo "unchanged"; exit 0; fi
          git config user.name "Mercury"
          git config user.email "mercury@cosmicstack.org"
          git add .github/badges
          git commit -m "chore(badges): refresh download totals [skip ci]"
          git push
