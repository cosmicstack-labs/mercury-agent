name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# One job per concern. Nothing in this workflow publishes or releases: the
# binary-smoke and installer jobs build and run throwaway artifacts only.
jobs:
  typecheck:
    name: Typecheck (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint (tsc + ESLint ratchet)
    # Provisional baseline (grep estimate): non-blocking until the first real
    # run refreshes .lint-baseline.json with `npm run lint:ratchet -- --update`.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # ESLint is pinned here rather than in package.json/package-lock.json so
      # `npm ci` in every other job is untouched. Move these into
      # devDependencies (and regenerate the lockfile) once the baseline is real.
      - name: Install ESLint (pinned, not saved)
        run: npm install --no-save --no-audit --no-fund eslint@9.39.5 @eslint/js@9.39.5 typescript-eslint@8.71.1
      # Ratchet: per-rule counts may only go down relative to .lint-baseline.json.
      # Refresh the baseline with `npm run lint:ratchet -- --update` after a
      # deliberate clean-up (or on the first run, when the baseline is provisional).
      - run: npm run lint:ratchet

  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  eval:
    # Replay-based eval harness (ROADMAP P2.3): drives the real agent loop
    # with scripted providers and recorded tool outputs. No network, no keys.
    name: Eval harness (Node 22, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval

  linux-arm64:
    name: Typecheck & Test (Node 22, linux-arm64)
    # GitHub-hosted arm64 runners (`ubuntu-24.04-arm`) are free for public
    # repos but not enabled in every org. Until a green run proves they are
    # available here, a missing runner must not block the pipeline.
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  pack-verify:
    name: Pack & Verify (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Verify package integrity
        run: node scripts/verify-package.cjs

      - name: Verify vendor/ink is stock ink 5.2.1 + the patch set (ADR-017)
        run: node scripts/vendor-ink.cjs --check

  binary-smoke:
    name: Binary smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Keep the smoke binary's state out of the runner's real home.
      MERCURY_HOME: ${{ github.workspace }}/.smoke-home
      # chalk forces colour on GitHub Actions; the greps below want plain text.
      FORCE_COLOR: '0'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build

      - name: Build host binary (release/smoke, never published)
        run: node scripts/build-bin.cjs --host-only

      - name: Locate binary
        id: bin
        shell: bash
        run: |
          set -euo pipefail
          bin=$(find release/smoke -maxdepth 2 -type f -name 'mercury-*' ! -name '*.tar.gz' | head -n 1)
          test -n "$bin" || { echo "::error::no host binary found under release/smoke"; ls -R release; exit 1; }
          ls -l "$bin"
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      - name: Smoke --version
        shell: bash
        run: |
          set -euo pipefail
          expected=$(node -p "require('./package.json').version")
          out=$("${{ steps.bin.outputs.path }}" --version)
          echo "--version → $out"
          [ "$out" = "$expected" ] || { echo "::error::--version printed '$out', expected '$expected'"; exit 1; }

      - name: Smoke --help
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.bin.outputs.path }}" --help | tee smoke-help.txt
          grep -q 'Usage:' smoke-help.txt

      - name: Smoke doctor --platform
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.bin.outputs.path }}" doctor --platform | tee smoke-platform.txt
          grep -q 'Mercury Platform Doctor' smoke-platform.txt

      - name: Smoke doctor --storage (bun:sqlite must be active)
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.bin.outputs.path }}" doctor --storage | sed 's/\x1b\[[0-9;]*m//g' | tee smoke-storage.txt
          # The standalone binary ships Bun's embedded SQLite. A JSON-only
          # report here means the driver fell through every backend.
          if grep -Eq 'SQLite backend: +bun:sqlite' smoke-storage.txt; then
            echo "bun:sqlite active"
          else
            echo "::error::doctor --storage did not report bun:sqlite as the active backend"
            exit 1
          fi
          if grep -q 'JSON-only' smoke-storage.txt; then
            echo "::error::doctor --storage reports JSON-only storage"
            exit 1
          fi

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-smoke-${{ matrix.os }}
          path: smoke-*.txt
          retention-days: 1
          if-no-files-found: ignore

  script-lint:
    name: Scripts (shellcheck + PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck scripts/install.sh scripts/install-dev.sh scripts/publish*.sh

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          Import-Module PSScriptAnalyzer
          (Get-Module PSScriptAnalyzer).Version

      - name: Invoke-ScriptAnalyzer scripts/*.ps1
        shell: pwsh
        run: |
          $results = @(Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error,Warning
          })
          foreach ($r in $results) {
            $level = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
            Write-Output "::$level file=$($r.ScriptPath),line=$($r.Line)::[$($r.RuleName)] $($r.Message)"
          }
          $errors = @($results | Where-Object Severity -eq 'Error')
          Write-Output "PSScriptAnalyzer: $($results.Count) finding(s), $($errors.Count) error(s)"
          # Warnings (Write-Host, Invoke-Expression, ShouldProcess) are expected
          # in a curl|iex-style installer and are surfaced as annotations only.
          if ($errors.Count -gt 0) { exit 1 }

  installer-smoke:
    name: Installer dry run (install.sh against a local release dir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build a fake release directory
        run: |
          set -euo pipefail
          version=9.9.9
          rel="$RUNNER_TEMP/fake-release/v$version"
          mkdir -p "$rel/web"
          # A tiny stub "binary": enough to pass the installer's --version smoke.
          cat > "$rel/mercury-linux-x64" <<'STUB'
          #!/bin/sh
          if [ "${1:-}" = "--version" ]; then echo "9.9.9"; exit 0; fi
          echo "mercury stub: $*"
          STUB
          chmod +x "$rel/mercury-linux-x64"
          echo '<!doctype html><title>stub dashboard</title>' > "$rel/web/index.html"
          tar -C "$rel" -czf "$rel/web.tar.gz" web
          (cd "$rel" && sha256sum mercury-linux-x64 web.tar.gz > checksums.txt)
          cat "$rel/checksums.txt"
          echo "REL_ROOT=$RUNNER_TEMP/fake-release" >> "$GITHUB_ENV"

      - name: Serve it over HTTP
        run: |
          set -euo pipefail
          (cd "$REL_ROOT" && python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &)
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/v9.9.9/checksums.txt > /dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8765/v9.9.9/checksums.txt

      - name: Run install.sh against the local release dir
        env:
          MERCURY_VERSION: 9.9.9
          MERCURY_DOWNLOAD_BASE: http://127.0.0.1:8765
          MERCURY_INSTALL: ${{ runner.temp }}/mercury-prefix
          MERCURY_NO_PATH: '1'
        run: |
          set -euo pipefail
          sh scripts/install.sh 2>&1 | tee "$RUNNER_TEMP/install.log"
          grep -q 'Checksums verified' "$RUNNER_TEMP/install.log"
          grep -q 'Smoke test passed' "$RUNNER_TEMP/install.log"
          test -x "$MERCURY_INSTALL/bin/mercury"
          test -f "$MERCURY_INSTALL/bin/web/index.html"
          [ "$("$MERCURY_INSTALL/bin/mercury" --version)" = "9.9.9" ]

      - name: install-dev.sh delegates to install.sh (dev channel, local release dir)
        env:
          MERCURY_DOWNLOAD_BASE: http://127.0.0.1:8765
          MERCURY_INSTALL: ${{ runner.temp }}/mercury-dev-prefix
          MERCURY_NO_PATH: '1'
        run: |
          set -euo pipefail
          # The dev channel resolves <base>/mercury-dev-latest/…; alias the fake
          # release under that tag.
          ln -s v9.9.9 "$REL_ROOT/mercury-dev-latest"
          sh scripts/install-dev.sh 2>&1 | tee "$RUNNER_TEMP/install-dev.log"
          grep -q 'Smoke test passed' "$RUNNER_TEMP/install-dev.log"
          test -x "$MERCURY_INSTALL/bin/mercury-dev"
          [ "$("$MERCURY_INSTALL/bin/mercury-dev" --version)" = "9.9.9" ]

      - name: A tampered checksum must abort the install
        env:
          MERCURY_VERSION: 9.9.9
          MERCURY_DOWNLOAD_BASE: http://127.0.0.1:8765
          MERCURY_INSTALL: ${{ runner.temp }}/mercury-tampered
          MERCURY_NO_PATH: '1'
        run: |
          set -euo pipefail
          sed -i 's/^[0-9a-f]\{8\}/00000000/' "$REL_ROOT/v9.9.9/checksums.txt"
          if sh scripts/install.sh > "$RUNNER_TEMP/tampered.log" 2>&1; then
            echo "::error::install.sh succeeded with a tampered checksums.txt"
            cat "$RUNNER_TEMP/tampered.log"
            exit 1
          fi
          grep -q 'Checksum mismatch' "$RUNNER_TEMP/tampered.log"
          test ! -e "$MERCURY_INSTALL/bin/mercury"

  termux:
    name: Termux (Android, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run CI in Termux container
        shell: bash
        run: |
          cat > /tmp/termux-ci.sh <<'CI_SCRIPT'
          #!/bin/sh
          set -ex
          export PATH=/data/data/com.termux/files/usr/bin:$PATH
          export HOME=/home/builder
          export npm_config_cache=/home/builder/project/.npm-cache
          export TERMUX_VERSION=u0
          # Repo setup: point sources.list at the official Cloudflare-backed mirror.
          # IMPORTANT: call apt directly, NOT the `pkg` wrapper — its mirror
          # auto-selection reads etc/termux/mirrors/* groups and exits 1
          # instantly in this container ("No mirror or mirror group selected",
          # run 37578325949). Raw apt needs none of that state.
          TM=/data/data/com.termux/files/usr
          echo 'deb https://packages-cf.termux.dev/apt/termux-main stable main' > "$TM/etc/apt/sources.list"
          apt_update() { apt-get update -y; }
          apt_update || {
            echo 'apt update failed on primary mirror, switching to backup...'
            echo 'deb https://packages.termux.dev/apt/termux-main stable main' > "$TM/etc/apt/sources.list"
            apt_update || {
              echo 'apt update failed on backup too, restoring primary and retrying...'
              echo 'deb https://packages-cf.termux.dev/apt/termux-main stable main' > "$TM/etc/apt/sources.list"
              apt_update
            }
          }
          # Retry package install up to 3 times — Termux mirrors are flaky
          for attempt in 1 2 3; do
            apt-get install -y git nodejs-lts python build-essential && break
            echo "apt install attempt $attempt failed, retrying..."
            apt-get update -y || true
          done
          cd /home/builder/project
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @rollup/wasm-node@4
          rm -rf node_modules/rollup
          ln -s @rollup/wasm-node node_modules/rollup
          # .bin symlinks aren't in PATH in Termux's ash — add them explicitly
          export PATH="$PWD/node_modules/.bin:$PATH"
          node node_modules/tsup/dist/cli-default.js
          node scripts/post-build.cjs
          node -e "try { const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.prepare('select 1').get(); db.close(); console.log('better-sqlite3 OK'); } catch (e) { console.log('better-sqlite3 unavailable (optional on Termux):', e.message); }"
          node -e "const { spawnSync } = require('node:child_process'); const r = spawnSync(process.execPath, ['dist/index.js', '--help'], { encoding: 'utf8' }); if (r.status !== 0 || !r.stdout.includes('Usage:')) process.exit(1)"
          # P0.6 Termux detection: Termux's own Node is an Android build, so
          # process.platform is 'android' on real devices ('linux' only for
          # glibc/proot builds). Print it, and assert that `service install`
          # (what autoDaemonize() runs after the wizard) exits 0 with a Termux
          # message — never "Unsupported platform: android" + exit 1.
          node -e "console.log('process.platform =', process.platform); if (process.platform !== 'android' && process.platform !== 'linux') { console.error('unexpected process.platform for Termux'); process.exit(1) }"
          node -e "const { spawnSync } = require('node:child_process'); const r = spawnSync(process.execPath, ['dist/index.js', 'service', 'install'], { encoding: 'utf8' }); const out = (r.stdout || '') + (r.stderr || ''); console.log(out); if (r.status !== 0 || /Unsupported platform/.test(out) || !/Termux/.test(out)) { console.error('service install on Termux must print the Termux hint and exit 0 (status ' + r.status + ')'); process.exit(1) }"
          # P2.8 Termux:Boot: `service install` writes an executable boot script
          # that takes a wake lock and runs `mercury up`; status sees it;
          # uninstall removes it.
          BOOT="$HOME/.termux/boot/mercury.sh"
          test -f "$BOOT" || { echo "service install did not write $BOOT"; exit 1; }
          test -x "$BOOT" || { echo "$BOOT is not executable"; exit 1; }
          cat "$BOOT"
          grep -q 'termux-wake-lock' "$BOOT"
          grep -Eq '(^| )up( |$)' "$BOOT"
          head -1 "$BOOT" | grep -q '^#!'
          node -e "const { spawnSync } = require('node:child_process'); const r = spawnSync(process.execPath, ['dist/index.js', 'service', 'status'], { encoding: 'utf8' }); const out = (r.stdout || '') + (r.stderr || ''); console.log(out); if (r.status !== 0 || !/\.termux\/boot\/mercury\.sh/.test(out) || /not installed/i.test(out)) { console.error('service status on Termux must report the installed boot script'); process.exit(1) }"
          node -e "const { spawnSync } = require('node:child_process'); const r = spawnSync(process.execPath, ['dist/index.js', 'service', 'uninstall'], { encoding: 'utf8' }); const out = (r.stdout || '') + (r.stderr || ''); console.log(out); if (r.status !== 0) { console.error('service uninstall on Termux must exit 0'); process.exit(1) }"
          test ! -e "$BOOT" || { echo "service uninstall left $BOOT behind"; exit 1; }
          node node_modules/vitest/vitest.mjs run
          CI_SCRIPT
          chmod +x /tmp/termux-ci.sh

          docker run --rm \
            --privileged \
            --entrypoint /entrypoint_root.sh \
            -v "${{ github.workspace }}:/home/builder/project" \
            -v /tmp/termux-ci.sh:/tmp/termux-ci.sh:ro \
            -e "HOME=/home/builder" \
            termux/termux-docker:x86_64 \
            bash -c "
              set -e
              chown -R system:system /home/builder
              mkdir -p /home/builder/.npm
              chown -R system:system /home/builder/.npm
              cp /tmp/termux-ci.sh /home/builder/termux-ci.sh
              chown system:system /home/builder/termux-ci.sh
              chmod +x /home/builder/termux-ci.sh
              su system /home/builder/termux-ci.sh
            "

