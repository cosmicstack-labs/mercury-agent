version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: ink
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
